name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve APK for this tag
        id: apk
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          apk="releases/CueFlow-${version}.apk"
          test -f "$apk"
          echo "path=$apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: CueFlow ${{ github.ref_name }}
          body_path: releases/release-notes-${{ github.ref_name }}.md
          files: ${{ steps.apk.outputs.path }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
