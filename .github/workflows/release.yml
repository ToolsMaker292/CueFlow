name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Publish GitHub Release with APK
        uses: softprops/action-gh-release@v2
        with:
          name: CueFlow ${{ github.ref_name }}
          body: |
            CueFlow 1.0.0 — local-first Android teleprompter.

            Downloads:
            - `CueFlow-1.0.0.apk` (signed release, Android 7.0+)

            Highlights:
            - Material 3 UI, dynamic color, dark mode
            - Smooth full-screen teleprompter with speed/font controls and countdown
            - Draggable camera preview; hide it while recording and keep a red recording dot
            - Local `.docx` import
            - TXT export and JSON backup/restore
            - No INTERNET permission; camera/microphone are used only while recording

            SHA-256:
            `B9EC5D71A28A8B664A6BBC361BCBB51ACE7B83CA2593D95E363A597E9C1CA77F`

            This APK uses the project test signing key. Re-sign with your own key before publishing to an app store.
          files: releases/CueFlow-1.0.0.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
